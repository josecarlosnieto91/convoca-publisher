name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  plugin-check:
    name: Plugin Check (PCP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor/
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest
          composer-options: '--ignore-platform-req=ext-iconv'
      - name: Run Plugin Check (WordPress.org)
        # Ejecuta Plugin Check (PCP) en categorías plugin_repo + security,
        # bloqueantes para publicar en WordPress.org. Los warnings no fallan;
        # cualquier ERROR sí (exit != 0).
        uses: wordpress/plugin-check-action@v1
        with:
          categories: |
            plugin_repo
            security
          ignore-warnings: 'true'
          wp-version: latest

  php-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2

      - name: Validate composer
        run: composer validate --strict

      - name: Configure composer auth
        run: |
          composer config --global github-oauth.github.com ${{ github.token }}
          composer config --global repo.packagist composer https://repo.packagist.org
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: PHP lint
        run: find . -name '*.php' -not -path './vendor/*' -exec php -l {} \;

      - name: PHPStan
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon --memory-limit=4G --no-progress

      - name: PHPUnit
        run: vendor/bin/phpunit --no-coverage
