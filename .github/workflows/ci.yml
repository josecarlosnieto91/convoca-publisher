name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  php-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2

      - name: Validate composer
        run: composer validate --strict

      - name: Configure composer auth
        run: |
          composer config --global github-oauth.github.com ${{ github.token }}
          composer config --global repo.packagist composer https://repo.packagist.org
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: PHP lint
        run: find . -name '*.php' -not -path './vendor/*' -exec php -l {} \;

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress || true

      - name: PHPUnit
        run: vendor/bin/phpunit --no-coverage || true
