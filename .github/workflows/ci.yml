name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-check:
    name: Plugin Check (PCP · version fijada y cacheada)
    runs-on: ubuntu-latest
    env:
      # Versiones FIJADAS a proposito (issue convoca-members#11). Al subirlas hay que volver a medir.
      WP_VERSION: '7.1.3'
      PLUGIN_CHECK_VERSION: '2.1.0'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2, wp-cli
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor/
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest
          composer-options: '--ignore-platform-req=ext-iconv'
      - name: Build clean plugin dir (as published)
        # Replica el paquete de distribución: excluye tooling dev (.distignore)
        # y archivos ocultos/prohibidos (.htaccess). vendor viaja (wp.org no
        # ejecuta composer y PCP activa el plugin en wp-env).
        run: |
          mkdir -p build-dir
          rsync -a --exclude-from=.distignore ./ build-dir/convoca-publisher/
          cp -r vendor build-dir/convoca-publisher/
          find build-dir/convoca-publisher -name '.htaccess' -delete
          # Quitar 'Requires Plugins' SOLO en el build-dir: la action de PCP
          # ejecuta 'wp plugin install <dep>' contra wp.org, y convoca-core aún
          # no está publicado. El header real del repo se mantiene (wp.org lo
          # auditará cuando core esté publicado también).
          sed -i '/Requires Plugins:/d' build-dir/convoca-publisher/convoca-publisher.php
          ls build-dir/convoca-publisher/
      - name: Traer las piezas fijadas (WordPress y Plugin Check), con cache
        # La cache guarda SOLO los dos zip. Antes guardaba ademas el WordPress ya descomprimido y el segundo
        # run pedia confirmacion para sobrescribirlo ("replace ... [y]es, [n]o, [A]ll, [N]one"), que en el CI
        # sin terminal es un fallo: unzip preguntaba y moria con EOF. Se cachea lo que hay que traer de la red,
        # no el resultado de usarlo.
        id: piezas
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pcp-archivos
          key: pcp2-wp${{ env.WP_VERSION }}-plugincheck${{ env.PLUGIN_CHECK_VERSION }}

      - name: Descargar las piezas (solo si no estan en cache)
        if: steps.piezas.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/pcp-archivos"
          traer() {
            if ! curl -fL --retry 5 --retry-all-errors --retry-delay 3 -o "$2" "$1"; then
              echo "::error title=Infraestructura, no el repositorio::No se pudo traer $1. Este rojo NO dice nada del codigo."
              exit 1
            fi
          }
          traer "https://wordpress.org/wordpress-${WP_VERSION}.zip" "$RUNNER_TEMP/pcp-archivos/wordpress.zip"
          traer "https://downloads.wordpress.org/plugin/plugin-check.${PLUGIN_CHECK_VERSION}.zip" "$RUNNER_TEMP/pcp-archivos/plugin-check.zip"

      - name: Preparar el WordPress de pruebas
        run: |
          mkdir -p "$RUNNER_TEMP/wp"
          unzip -oq "$RUNNER_TEMP/pcp-archivos/wordpress.zip" -d "$RUNNER_TEMP/wp"
          cp -r build-dir/convoca-publisher "$RUNNER_TEMP/wp/wordpress/wp-content/plugins/convoca-publisher"
          wp config create --path="$RUNNER_TEMP/wp/wordpress" --dbname=wordpress \
            --dbuser=root --dbpass=root --dbhost=127.0.0.1
          wp core install --path="$RUNNER_TEMP/wp/wordpress" --url=http://localhost:8880 \
            --title=Convoca --admin_user=admin --admin_password=NoEsUnSecreto123 \
            --admin_email=ci@example.org --skip-email

      - name: Run Plugin Check (WordPress.org, version fijada)
        run: |
          wp plugin install "$RUNNER_TEMP/pcp-archivos/plugin-check.zip" --activate --path="$RUNNER_TEMP/wp/wordpress"
          wp plugin activate convoca-publisher --path="$RUNNER_TEMP/wp/wordpress"
          wp plugin check convoca-publisher \
            --path="$RUNNER_TEMP/wp/wordpress" \
            --categories=plugin_repo,security \
            --ignore-warnings=true

  php-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2

      - name: Validate composer
        run: composer validate --strict

      - name: Configure composer auth
        run: |
          composer config --global github-oauth.github.com ${{ github.token }}
          composer config --global repo.packagist composer https://repo.packagist.org
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar gettext (msgfmt, del contrato de traducciones)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gettext
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: PHP lint
        run: find . -name '*.php' -not -path './vendor/*' -exec php -l {} \;

      - name: PHPStan
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon --memory-limit=4G --no-progress

      - name: PHPUnit
        run: vendor/bin/phpunit --no-coverage

  phpcs:
    name: PHPCS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      # Sin `|| true`: con el, phpcs no podria fallar el job nunca y el check seria
      # decorativo. El estandar y sus exclusiones (TODAS con motivo escrito dentro del
      # fichero) viven en .phpcs.xml.dist, igual que en el resto del ecosistema.
      - name: PHPCS (estandar del ecosistema)
        run: vendor/bin/phpcs --standard=.phpcs.xml.dist

  higiene:
    name: Higiene de datos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # El cliente no aparece en el producto (convoca-health-check#12/#13).
      # El guardián NO lleva los nombres en su código: este repositorio es público y la lista de lo
      # prohibido era el índice de clientes. Se descarga el de convoca-health-check (fuente única) y los
      # nombres llegan por secret. Secret y no variable: en un repositorio público el contexto `vars` SÍ
      # se entrega a los workflows de un PR abierto desde un fork, así que cualquiera podría imprimirlo.
      # Si el secret no está (PR desde un fork, secret borrado), el guardián avisa en el registro y sigue
      # vigilando dominios y correos; no se calla.
      - name: El cliente no aparece en el producto
        env:
          CONVOCA_HYGIENE_CLIENTES: ${{ secrets.CONVOCA_HYGIENE_CLIENTES }}
        run: |
          curl -fsSL --retry 3 --retry-delay 2 \
            -o "$RUNNER_TEMP/higiene.py" \
            https://raw.githubusercontent.com/josecarlosnieto91/convoca-health-check/main/scripts/check-data-hygiene.py
          python3 "$RUNNER_TEMP/higiene.py" .

  acoplamiento:
    name: Acoplamiento entre plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Un plugin no provee la funcionalidad de otro. Guardián nuevo (21/10/2026), nacido de cuatro defectos
      # reales: tres plugins creando roles de personas, shifts averiguando quién es voluntario por rol, y
      # members#64 —un fatal en el cron que ningún test veía porque sólo se rompe con Gateway DESACTIVADO—.
      # Limpiar a mano no dura: esto lo convierte en prueba de cada empujón.
      #
      # R4 (decidir por rol o capacidad de personas) va en AVISO: mide la deuda y la deja a la vista, pero no
      # bloquea hasta que la fase F1 (identidad de socio) la resuelva. Lo que bloquea es lo que ya se cumple.
      - name: Cada plugin, a lo suyo
        run: |
          curl -fsSL --retry 3 --retry-delay 2 \
            -o "$RUNNER_TEMP/acoplamiento.py" \
            https://raw.githubusercontent.com/josecarlosnieto91/convoca-health-check/main/scripts/check-acoplamiento.py
          python3 "$RUNNER_TEMP/acoplamiento.py" . --reglas R1,R2,R3 --avisos R4

  # Puerta de calidad con ratchet: dependencias, secretos, Semgrep propio, PHPMD y PHPStan.
  # Los números de .quality/baseline.json solo pueden bajar.
  calidad:
    uses: josecarlosnieto91/convoca-health-check/.github/workflows/quality.yml@main
